services:
  frontend:
    image: hotchasing/frontend:${FRONTEND_IMAGE_TAG:-local}
    build: .
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      - BACKEND_HOST=${BACKEND_HOST:-backend:3000}
    restart: unless-stopped

  backend:
    image: hotchasing/server:${BACKEND_IMAGE_TAG:-local}
    build: ./server
    expose:
      - "3000"
    environment:
      - API_SECRET=${API_SECRET:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  backend-data:
