# Electron Builder配置文件
appId: com.hotchasing.app
productName: HotChasing
copyright: Copyright © 2026 HotChasing

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: runner
    to: runner

extraMetadata:
  main: electron/main.js

# Windows配置
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  icon: dist/vite.svg
  
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HotChasing

# macOS配置  
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: dist/vite.svg
  category: public.app-category.productivity

dmg:
  title: HotChasing
  icon: dist/vite.svg
  window:
    width: 540
    height: 380
  contents:
    - x: 410
      y: 230
      type: link
      path: /Applications
    - x: 130
      y: 230
      type: file

# Linux配置
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: dist/vite.svg
  category: Office
  synopsis: Local-first hot open-source project discovery and tracking
  description: >
    HotChasing is a local-first tool for discovering, tracking, and summarizing
    noteworthy open-source projects.

# 发布配置
publish:
  provider: github
  owner: your-username
  repo: your-repo-name
